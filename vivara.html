  <h2 class="post-title" itemprop="name">O ponto mais importante</h2>

  <p class="post-excerp" itemprop="description">
    Esse ganho de margem não significa necessariamente que a operação estrutural da Vivara ficou permanentemente mais eficiente. Parte do efeito pode ser temporário e estar relacionado ao custo histórico do estoque.

É como se a empresa tivesse comprado matéria-prima mais barata no passado e, agora, estivesse vendendo produtos fabricados com esse estoque enquanto o preço de reposição do ouro está muito mais alto.
  </p>

  <p>
   O problema aparece mais à frente: quando esse estoque acumulado acabar, a Vivara terá de voltar a comprar ouro. Se o preço do metal continuar elevado, o custo de produção poderá subir e pressionar as margens futuras, a menos que a empresa consiga repassar esse aumento aos consumidores por meio dos preços.
    
  </p>

<h2 class="post-title" itemprop="name">Vivara deixa de comprar ouro, usa estoque acumulado e alcança margem recorde, diz CFO</h2>
<p class="post-excerp">A estratégia de estoque pode ter efeito bastante positivo sobre a margem da Vivara, especialmente quando o ouro está caro.

A lógica é simples:

A Vivara deixou de comprar ouro novo e passou a utilizar o metal que já estava em estoque.
Esse estoque foi adquirido anteriormente, possivelmente a preços inferiores aos atuais.
Ao produzir e vender joias usando esse ouro mais barato, o custo do produto vendido fica

Liu Kang e pode morrer em batalha</p>

   function atualizarTempo() {
  const timeEl = document.querySelector("#data-modificação time");

  const dataPublicacao = new Date(timeEl.getAttribute("datetime"));
  const agora = new Date();
  const diffMs = agora - dataPublicacao;

  const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24));

  if (dias <= 0) {
    timeEl.textContent = "hoje";
  } else if (dias === 1) {
    timeEl.textContent = "há 1 dia";
  } else {
    timeEl.textContent = `há ${dias} dias`;
  }
}
